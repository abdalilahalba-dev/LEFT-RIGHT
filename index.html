<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Left or Right</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Rubik+Mono+One&display=swap">
<style>
  /* Layout: one full-screen canvas stage, a headline in the middle, two big buttons at the bottom. Single deliberate dusk look. */
  :root {
    --stage: #262833;
    --ink: #f3f1fb;
    --muted: #a9a8bd;
    --void: #0a0910;
    --void-edge: #3b3550;
    --pop-a: #ff3d7f;
    --pop-b: #ffb21f;
    --pop-c: #23d5ab;
    --pop-d: #3c8cff;
    --font-display: "Rubik Mono One", "Arial Black", Impact, sans-serif;
    --font-body: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--stage);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .ui {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-rows: 1fr auto;
    padding-inline: 16px;
    padding-block: 24px calc(28px + env(safe-area-inset-bottom, 0px));
    pointer-events: none;
  }
  .headline {
    align-self: center;
    justify-self: center;
    text-align: center;
    display: grid;
    gap: 12px;
  }
  .headline h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2.2rem, 9vw, 6rem);
    line-height: 0.95;
    letter-spacing: -0.02em;
    text-wrap: balance;
    transition: transform 0.5s cubic-bezier(.2,.9,.3,1.4), color 0.6s ease;
  }
  .headline p {
    margin: 0;
    color: var(--muted);
    font-size: clamp(0.95rem, 2.4vw, 1.15rem);
  }
  .headline kbd {
    font-family: var(--font-body);
    font-weight: 800;
    padding: 1px 7px;
    border: 1px solid #4a4b5e;
    border-radius: 6px;
    color: var(--ink);
  }
  body.is-bright .headline h1 { transform: scale(1.06) rotate(-2deg); color: #fff; }
  body.is-dark .headline h1 { transform: scale(0.94); color: #8c86a8; }

  .controls {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    pointer-events: auto;
  }
  .btn {
    font-family: var(--font-display);
    font-size: clamp(1rem, 3.4vw, 1.4rem);
    letter-spacing: 0.04em;
    min-width: min(42vw, 220px);
    padding: 20px 28px;
    border-radius: 999px;
    border: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: transform 0.15s ease, box-shadow 0.25s ease;
  }
  .btn:active { transform: scale(0.95); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

  .btn-left {
    background: var(--void);
    color: #cfc9e8;
    box-shadow: inset 0 0 0 2px var(--void-edge), 0 10px 30px rgba(0,0,0,.5);
  }
  .btn-left:hover { box-shadow: inset 0 0 0 2px #6a5f91, 0 10px 40px rgba(20,0,40,.8); }

  .btn-right {
    color: #1a1020;
    background: linear-gradient(100deg, var(--pop-b), var(--pop-a) 40%, var(--pop-d) 75%, var(--pop-c));
    background-size: 200% 100%;
    box-shadow: 0 10px 30px rgba(255, 61, 127, .35);
    animation: shimmer 4s linear infinite;
  }
  .btn-right:hover { box-shadow: 0 10px 44px rgba(255, 178, 31, .55); }
  @keyframes shimmer { to { background-position: 200% 0; } }

  @media (prefers-reduced-motion: reduce) {
    .btn-right { animation: none; }
    .headline h1 { transition: color 0.6s ease; }
    body.is-bright .headline h1, body.is-dark .headline h1 { transform: none; }
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div class="ui">
  <div class="headline">
    <h1 id="headline">Pick a side</h1>
    <p>Click a button, or press <kbd>←</kbd> / <kbd>→</kbd></p>
  </div>
  <div class="controls">
    <button class="btn btn-left" id="btn-left" type="button"><span aria-hidden="true">←</span> LEFT</button>
    <button class="btn btn-right" id="btn-right" type="button">RIGHT <span aria-hidden="true">→</span></button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const headline = document.getElementById('headline');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const amount = reduced ? 0.35 : 1;

  let W = 0, H = 0, dpr = 1;
  const resize = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  window.addEventListener('resize', resize);
  resize();

  // mood: +1 = full colour, -1 = full dark, eases back toward 0
  let mood = 0, moodTarget = 0, hue = 0, flash = 0;
  const confetti = [], rings = [], smoke = [], embers = [], voids = [];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];

  const PALETTE = ['#ff3d7f', '#ffb21f', '#23d5ab', '#3c8cff', '#b45cff', '#fff35c'];

  function goRight(x, y) {
    moodTarget = 1;
    flash = 1;
    document.body.classList.remove('is-dark');
    document.body.classList.add('is-bright');
    headline.textContent = 'Light it up!';
    const n = Math.round(260 * amount);
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(4, 16);
      confetti.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - rand(2, 6),
        w: rand(6, 14), h: rand(4, 9), rot: rand(0, 6.28), vr: rand(-0.3, 0.3),
        color: pick(PALETTE), life: 0, max: rand(90, 160), shape: Math.random() < 0.3 ? 'circle' : 'rect'
      });
    }
    for (let i = 0; i < 5; i++) {
      rings.push({ x, y, r: 0, speed: 9 + i * 3.5, hue: (hue + i * 60) % 360, life: 0, max: 70, delay: i * 5 });
    }
    // a second burst from the far side for symmetry
    for (let k = 0; k < 3; k++) {
      const bx = rand(W * 0.1, W * 0.9), by = rand(H * 0.1, H * 0.55);
      setTimeout(() => sparkBurst(bx, by), 180 + k * 160);
    }
  }

  function sparkBurst(x, y) {
    const n = Math.round(70 * amount), color = pick(PALETTE);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, s = rand(3, 8);
      confetti.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        w: 4, h: 4, rot: 0, vr: 0, color, life: 0, max: rand(50, 80), shape: 'spark'
      });
    }
  }

  function goLeft(x, y) {
    moodTarget = -1;
    document.body.classList.remove('is-bright');
    document.body.classList.add('is-dark');
    headline.textContent = 'Into the dark…';
    voids.push({ x, y, r: 0, life: 0, max: 110 });
    const n = Math.round(90 * amount);
    for (let i = 0; i < n; i++) {
      // smoke rolls in from the edges toward the click
      const edge = Math.random() * 4 | 0;
      const sx = edge === 0 ? -60 : edge === 1 ? W + 60 : rand(0, W);
      const sy = edge === 2 ? -60 : edge === 3 ? H + 60 : rand(0, H);
      const a = Math.atan2(y - sy, x - sx), s = rand(1.5, 4);
      smoke.push({
        x: sx, y: sy, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        r: rand(40, 110), grow: rand(0.4, 1.2), life: 0, max: rand(120, 200),
        tint: Math.random() < 0.25 ? [70, 30, 110] : [18, 14, 28]
      });
    }
    const e = Math.round(80 * amount);
    for (let i = 0; i < e; i++) {
      embers.push({
        x: rand(0, W), y: rand(0, H), vx: rand(-0.4, 0.4), vy: rand(-1.4, -0.3),
        r: rand(1, 2.6), life: 0, max: rand(140, 260), phase: rand(0, 6.28)
      });
    }
  }

  function step() {
    mood += (moodTarget - mood) * 0.06;
    moodTarget *= 0.985; // slowly settle back to neutral
    if (Math.abs(moodTarget) < 0.02) {
      moodTarget = 0;
      document.body.classList.remove('is-bright', 'is-dark');
      if (Math.abs(mood) < 0.05 && headline.textContent !== 'Pick a side') headline.textContent = 'Pick a side';
    }
    hue = (hue + 1.2) % 360;
    flash *= 0.9;

    // base stage
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#262833';
    ctx.fillRect(0, 0, W, H);

    // colourful wash
    if (mood > 0.01) {
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, `hsla(${hue}, 95%, 60%, ${mood * 0.85})`);
      g.addColorStop(0.5, `hsla(${(hue + 80) % 360}, 95%, 58%, ${mood * 0.85})`);
      g.addColorStop(1, `hsla(${(hue + 170) % 360}, 95%, 60%, ${mood * 0.85})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    if (flash > 0.01) {
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.35})`;
      ctx.fillRect(0, 0, W, H);
    }

    // dark wash with vignette
    if (mood < -0.01) {
      const m = -mood;
      ctx.fillStyle = `rgba(6,5,10,${m * 0.9})`;
      ctx.fillRect(0, 0, W, H);
      const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.15, W / 2, H / 2, Math.max(W, H) * 0.75);
      v.addColorStop(0, 'rgba(0,0,0,0)');
      v.addColorStop(1, `rgba(0,0,0,${m * 0.9})`);
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, W, H);
      // rare purple lightning flicker
      if (!reduced && m > 0.5 && Math.random() < 0.012) {
        ctx.fillStyle = 'rgba(120,80,200,0.18)';
        ctx.fillRect(0, 0, W, H);
      }
    }

    // void circles swallowing the light
    for (let i = voids.length - 1; i >= 0; i--) {
      const o = voids[i]; o.life++;
      const t = o.life / o.max;
      o.r = Math.max(W, H) * 0.9 * (1 - Math.pow(1 - t, 3));
      const a = 1 - t;
      const g = ctx.createRadialGradient(o.x, o.y, o.r * 0.7, o.x, o.y, o.r);
      g.addColorStop(0, `rgba(5,4,9,${a * 0.6})`);
      g.addColorStop(0.92, `rgba(80,50,130,${a * 0.5})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill();
      if (o.life >= o.max) voids.splice(i, 1);
    }

    // smoke
    for (let i = smoke.length - 1; i >= 0; i--) {
      const p = smoke[i]; p.life++;
      p.x += p.vx; p.y += p.vy; p.vx *= 0.985; p.vy *= 0.985; p.r += p.grow;
      const t = p.life / p.max;
      const a = Math.sin(t * Math.PI) * 0.35;
      const [r, g, b] = p.tint;
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      grad.addColorStop(0, `rgba(${r},${g},${b},${a})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      if (p.life >= p.max) smoke.splice(i, 1);
    }

    // embers drifting up in the dark
    ctx.globalCompositeOperation = 'lighter';
    for (let i = embers.length - 1; i >= 0; i--) {
      const p = embers[i]; p.life++;
      p.x += p.vx + Math.sin(p.life * 0.03 + p.phase) * 0.3; p.y += p.vy;
      const t = p.life / p.max;
      const a = Math.sin(t * Math.PI) * (0.5 + 0.5 * Math.sin(p.life * 0.15 + p.phase));
      ctx.fillStyle = `rgba(160,110,255,${a * 0.8})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(160,110,255,${a * 0.15})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2); ctx.fill();
      if (p.life >= p.max) embers.splice(i, 1);
    }

    // colour rings
    for (let i = rings.length - 1; i >= 0; i--) {
      const o = rings[i];
      if (o.delay > 0) { o.delay--; continue; }
      o.life++; o.r += o.speed; o.speed *= 0.97;
      const a = 1 - o.life / o.max;
      ctx.strokeStyle = `hsla(${o.hue}, 100%, 65%, ${a})`;
      ctx.lineWidth = 10 * a + 1;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.stroke();
      if (o.life >= o.max) rings.splice(i, 1);
    }

    // confetti and sparks
    for (let i = confetti.length - 1; i >= 0; i--) {
      const p = confetti[i]; p.life++;
      const t = p.life / p.max;
      if (p.shape === 'spark') {
        p.vx *= 0.95; p.vy = p.vy * 0.95 + 0.06;
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = p.color; ctx.globalAlpha = 1 - t; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 3, p.y - p.vy * 3); ctx.stroke();
      } else {
        p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.22; p.rot += p.vr;
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = t > 0.75 ? (1 - t) / 0.25 : 1;
        ctx.fillStyle = p.color;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        if (p.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
        else ctx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.rot * 2)), p.w, p.h * Math.abs(Math.cos(p.rot * 2)) + 1);
        ctx.restore();
      }
      p.x += p.vx; p.y += p.vy;
      ctx.globalAlpha = 1;
      if (p.life >= p.max || p.y > H + 40) confetti.splice(i, 1);
    }
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  const centerOf = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const btnL = document.getElementById('btn-left');
  const btnR = document.getElementById('btn-right');
  btnL.addEventListener('click', () => goLeft(...centerOf(btnL)));
  btnR.addEventListener('click', () => goRight(...centerOf(btnR)));
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); goLeft(...centerOf(btnL)); }
    if (e.key === 'ArrowRight') { e.preventDefault(); goRight(...centerOf(btnR)); }
  });
})();
</script>
</body>
</html>
